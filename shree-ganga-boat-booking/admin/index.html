<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - GangaRide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #0a1a24, #14212b); min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
        .login-container { width: 100%; max-width: 420px; }
        .login-card { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border-radius: 24px; padding: 2.5rem; box-shadow: 0 30px 80px rgba(0,0,0,0.4); }
        .login-card h1 { font-size: 1.8rem; color: var(--river-dark); margin-bottom: 0.3rem; }
        .login-card p { color: #60717c; margin-bottom: 1.5rem; font-size: 0.9rem; }
        :root { --river: #0b7285; --river-dark: #064b57; --saffron: #d77a21; --line: #dbe7e5; --ink: #14212b; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 800; font-size: 0.85rem; color: var(--ink); margin-bottom: 0.3rem; }
        .form-group input { width: 100%; min-height: 50px; padding: 0 1rem; border: 2px solid var(--line); border-radius: 12px; font: inherit; font-weight: 600; transition: border-color 0.2s ease; }
        .form-group input:focus { outline: none; border-color: var(--river); box-shadow: 0 0 0 3px rgba(11,114,133,0.14); }
        .login-btn { width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--river); color: white; font: inherit; font-weight: 900; cursor: pointer; transition: background 0.2s ease; font-size: 1rem; }
        .login-btn:hover { background: var(--river-dark); }
        .error-msg { color: #9f1239; background: #ffe4e6; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem; font-weight: 700; font-size: 0.85rem; display: none; }
        .error-msg.show { display: block; }
        .logo-link { text-decoration: none; display: inline-block; margin-bottom: 1.5rem; }
        .logo-link span { font-size: 1.5rem; font-weight: 900; color: var(--river-dark); }
        .logo-link small { display: block; color: var(--saffron); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; }
        @media (max-width: 480px) {
            .login-card { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <a href="../index.html" class="logo-link">
                <span>GangaRide</span>
                <small>Admin Panel</small>
            </a>
            <h1>Admin Login</h1>
            <p>Enter your credentials to manage bookings.</p>
            
            <div class="error-msg" id="errorMsg">Invalid credentials. Please try again.</div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="admin" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            
            <p style="margin-top: 1rem; font-size: 0.8rem; color: #60717c; text-align: center;">
                Default: admin / admin123
            </p>
        </div>
    </div>

    <script>
        const ADMIN_CREDENTIALS = { username: 'neo1', password: 'ben 10' };
        
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                // Store admin session
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminLoginTime', new Date().toISOString());
                window.location.href = 'dashboard.html';
            } else {
                document.getElementById('errorMsg').classList.add('show');
                setTimeout(() => {
                    document.getElementById('errorMsg').classList.remove('show');
                }, 3000);
            }
        });
        
        // Enter key support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
